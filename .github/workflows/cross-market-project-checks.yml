name: Cross-market project checks

on:
  pull_request:
    paths:
      - "cross-market-business-forecasting-audit/**"
      - ".github/workflows/cross-market-project-checks.yml"
  push:
    branches:
      - main
    paths:
      - "cross-market-business-forecasting-audit/**"
      - ".github/workflows/cross-market-project-checks.yml"

permissions:
  contents: read

concurrency:
  group: cross-market-project-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cross-market-business-forecasting-audit

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cross-market-business-forecasting-audit/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify deterministic synthetic data
        run: |
          python scripts/generate_synthetic_data.py
          git diff --exit-code -- data/forecasting.csv data/segmentation.csv

      - name: Execute notebooks
        run: |
          mkdir -p /tmp/executed-notebooks
          for notebook in notebooks/*.ipynb; do
            jupyter nbconvert \
              --to notebook \
              --execute "$notebook" \
              --output-dir /tmp/executed-notebooks \
              --ExecutePreprocessor.timeout=180
          done
